name: ldlc-nosql

services:
  # Prod : replica set 3 nœuds (puis sharding par catégorie/hash si besoin)
  mongo:
    image: mongo:8
    command: --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_DATABASE: ldlc
    volumes:
      - mongo_data:/data/db
      - ./db/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Prod : Redis Cluster (6 nœuds : 3 primaires + 3 réplicas) ou Sentinel
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy volatile-ttl
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prod : 2 datacenters (Paris, Lyon) x 3 nœuds, RF=3 par DC (NetworkTopologyStrategy)
  cassandra:
    image: cassandra:5.0
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: ldlc
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  # Job one-shot : applique le schéma CQL
  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./db/cassandra/schema.cql:/schema.cql:ro
    entrypoint: ["cqlsh", "cassandra", "9042", "-f", "/schema.cql"]
    restart: "no"

  # Prod : cluster Neo4j (3 primaires Raft + réplicas secondaires de lecture)
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/ldlc-password
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ldlc-password 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Job one-shot : contraintes et index
  neo4j-init:
    image: neo4j:5.26-community
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./db/neo4j/schema.cypher:/schema.cypher:ro
    entrypoint: ["cypher-shell", "-a", "bolt://neo4j:7687", "-u", "neo4j", "-p", "ldlc-password", "-f", "/schema.cypher"]
    restart: "no"

volumes:
  mongo_data:
  redis_data:
  cassandra_data:
  neo4j_data:
